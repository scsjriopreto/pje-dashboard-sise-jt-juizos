name: Atualiza juizos pelo cronograma

on:
  schedule:
    # dias úteis, de hora em hora das 08:05 às 18:05 (horário de Brasília = UTC-3)
    - cron: "5 11-21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write

concurrency:
  group: atualiza-juizos
  cancel-in-progress: false

jobs:
  atualiza:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instala dependências
        run: pip install openpyxl

      - name: Gera juizos a partir da planilha
        run: python scripts/atualiza_juizos.py

      - name: Commit (se houver mudança)
        id: commit
        run: |
          if git diff --quiet -- juizos; then
            echo "Sem alterações."
            echo "mudou=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add juizos
          git commit -m "Atualiza juizos pelo cronograma ($(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M'))"
          git push
          echo "mudou=true" >> "$GITHUB_OUTPUT"

      - name: Republica o GitHub Pages
        if: steps.commit.outputs.mudou == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
